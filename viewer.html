<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdpreview</title>
<script src="err-surface.js"></script>
<script src="theme-boot.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg-side:#f7f8fa; --fg:#1f2328; --fg-dim:#656d76;
    --border:#d8dee4; --accent:#0969da; --accent-soft:#ddf4ff;
    --code-bg:#f6f8fa; --mark:#fff8c5;
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --bg-side:#161b22; --fg:#e6edf3; --fg-dim:#9198a1;
    --border:#30363d; --accent:#4493f8; --accent-soft:#17233a;
    --code-bg:#161b22; --mark:#3f2e00;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;}
  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- 左侧 ---------- */
  #side{width:340px;min-width:220px;max-width:60vw;flex:0 0 auto;
        background:var(--bg-side);border-right:1px solid var(--border);
        display:flex;flex-direction:column}
  #side header{padding:12px 14px 8px;border-bottom:1px solid var(--border)}
  #side h1{margin:0 0 4px;font-size:13px;letter-spacing:.04em;color:var(--fg-dim);
           text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #side h1 .btn{margin-left:5px;float:right}
  .btn{display:inline-block;border:1px solid var(--border);border-radius:6px;
       background:var(--bg);color:var(--fg);font-size:12.5px;line-height:1.5;
       padding:3px 10px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  #filter{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;
          background:var(--bg);color:var(--fg);font-size:13px}
  #opts{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px;color:var(--fg-dim)}
  #tree{flex:1;overflow:auto;padding:8px 6px 40px}
  .node{padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .node:hover{background:var(--accent-soft)}
  .node.sel{background:var(--accent);color:#fff}
  .node.dir{font-weight:600}
  .node.dir.open .caret{transform:rotate(90deg)}
  .kids{margin-left:11px;border-left:1px solid var(--border);padding-left:5px}
  .hidden{display:none}
  .fhide{display:none!important}
  /* ---------- 文件树加载动画 ---------- */
  #treeLoading{display:none;padding:12px 14px;font-size:13px;color:var(--fg-dim)}
  #treeLoading.show{display:block}
  #treeLoading .spinner{display:inline-block;width:14px;height:14px;vertical-align:-2px;
    margin-right:6px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #drag{width:5px;cursor:col-resize;background:transparent;flex:0 0 auto}
  #drag:hover{background:var(--accent)}

  /* ---------- 右侧 ---------- */
  #main{flex:1;overflow:auto;position:relative}
  #crumb{position:sticky;top:0;z-index:5;background:var(--bg);
         border-bottom:1px solid var(--border);padding:9px 28px;font-size:12.5px;
         color:var(--fg-dim);display:flex;gap:10px;align-items:center}
  #crumb .path{font-family:ui-monospace,Consolas,monospace}
  #doc{max-width:980px;margin:0 auto;padding:26px 28px 120px}
  #doc h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em;margin-top:1.2em}
  #doc h2{font-size:1.45em;border-bottom:1px solid var(--border);padding-bottom:.25em;margin-top:1.8em}
  #doc h3{font-size:1.2em;margin-top:1.5em}
  #doc table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px;display:block;overflow-x:auto}
  #doc th,#doc td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
  #doc th{background:var(--bg-side);font-weight:600}
  #doc tr:nth-child(even) td{background:color-mix(in srgb, var(--bg-side) 45%, transparent)}
  #doc code{background:var(--code-bg);padding:.15em .4em;border-radius:4px;
            font-family:ui-monospace,Consolas,monospace;font-size:.88em}
  #doc pre{background:var(--code-bg);padding:13px 15px;border-radius:8px;overflow:auto;
           border:1px solid var(--border)}
  #doc pre code{background:none;padding:0}
  #doc blockquote{margin:1em 0;padding:.4em 1em;border-left:4px solid var(--border);color:var(--fg-dim)}
  #doc a{color:var(--accent);text-decoration:none}
  #doc a:hover{text-decoration:underline}
  #doc img{max-width:100%}
  #doc hr{border:none;border-top:1px solid var(--border);margin:2em 0}
  details.fm{margin:0 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-side)}
  details.fm summary{cursor:pointer;padding:8px 13px;font-size:12.5px;color:var(--fg-dim);user-select:none}
  details.fm pre{margin:0;border:none;border-top:1px solid var(--border);border-radius:0 0 8px 8px;font-size:12.5px}
  .mermaid{margin:1.2em 0;text-align:center;overflow-x:auto}
  .mermaid svg{max-width:100%;height:auto}
  .err{border:1px solid #d1242f;background:#ffebe9;color:#82071e;padding:10px 13px;
       border-radius:8px;font-size:13px;white-space:pre-wrap}
  :root[data-theme="dark"] .err{background:#2d1618;color:#ff9c9c;border-color:#6e2329}

  /* ---------- 环境警告条（非扩展页面时显示） ---------- */
  #envWarn{display:none;background:#fff3cd;color:#664d03;border-bottom:1px solid #decc9a;
           padding:7px 14px;font-size:12.5px;line-height:1.5}
  :root[data-theme="dark"] #envWarn{background:#332b00;color:#ffd966;border-color:#6e5a00}

  /* ---------- 欢迎/错误页 ---------- */
  .welcome{max-width:560px;margin:80px auto;padding:0 24px;text-align:center}
  .welcome h2{font-size:1.4em;margin:0 0 10px}
  .welcome p{color:var(--fg-dim);font-size:14px}
  .welcome .btn{font-size:14px;padding:7px 18px;margin-top:6px}
</style>
</head>
<body>
<div id="envWarn"></div>
<div id="app">
  <aside id="side">
    <header>
      <h1><span id="sideTitle">mdpreview</span><button class="btn" id="settingsBtn" title="">⚙</button><button class="btn" id="themeBtn" title="">🌓</button><button class="btn" id="switchDirBtn"></button></h1>
      <input id="filter" autocomplete="off">
      <div id="opts">
        <span id="count"></span>
      </div>
    </header>
    <div id="treeLoading"><span class="spinner"></span><span id="treeLoadingText"></span></div>
    <div id="tree"></div>
  </aside>
  <div id="drag"></div>
  <main id="main">
    <div id="crumb"><span class="path" id="crumbPath"></span></div>
    <div id="doc"><div class="empty welcome">
      <h2>mdpreview</h2>
      <p>加载中… / Loading…</p>
      <button class="btn" id="pickBtn">选择文件夹…</button>
    </div></div>
  </main>
</div>

<script src="lib/marked.min.js"></script>
<script src="lib/mermaid.min.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
