<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KaTeX 集成测试</title>
<link rel="stylesheet" href="../lib/katex/katex.min.css">
<style>
  body{font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;max-width:820px;margin:24px auto;padding:0 16px}
  pre{background:#f6f8fa;padding:12px;border-radius:8px;overflow:auto}
  #summary{margin-top:24px;padding:12px;border-radius:8px;font-size:13px;white-space:pre-wrap}
  .pass{background:#e6ffec;border:1px solid #1a7f37}
  .fail{background:#ffebe9;border:1px solid #d1242f}
</style>
</head>
<body>
<div id="out"></div>
<div id="summary"></div>
<script src="../lib/marked.min.js"></script>
<script src="../lib/katex/katex.min.js"></script>
<script type="module">
import { katexExtensions } from '../katex-ext.js';
marked.use({ extensions: katexExtensions(katex) });

const md = [
  '行内公式: $E = mc^2$ 结束。',
  '',
  '块级公式:',
  '',
  '$$',
  '\\int_0^1 x^2 \\, dx = \\frac{1}{3}',
  '$$',
  '',
  '段落内块级: $$a^2 + b^2 = c^2$$ 尾随文字。',
  '',
  '货币不应被解析: $100 and $200 dollars.',
  '',
  '代码行内保持原文: `$x^2$` 应保持。',
  '',
  '```js',
  'const s = "$notmath$";',
  '```',
  '',
  '常见排版: $\\alpha, \\beta, \\sum_{i=1}^{n} i$',
].join('\n');

document.getElementById('out').innerHTML = marked.parse(md);

// ---- 自动断言 ----
const out = document.getElementById('out');
const katexCount = out.querySelectorAll('.katex').length;
const displayCount = out.querySelectorAll('.katex-display').length;
const codeText = out.querySelector('pre code') ? out.querySelector('pre code').textContent : '';
const currencyOk = /¥?\$100 and \$200 dollars/.test(out.textContent) || out.textContent.includes('$100 and $200 dollars');
const inlineCodeOk = Array.from(out.querySelectorAll('code')).some(c => c.textContent === '$x^2$');

const results = [
  ['行内/块级公式已渲染 (>=3 个 .katex)', katexCount >= 3, 'count=' + katexCount],
  ['块级公式有 .katex-display (>=2: 块 + 段落内)', displayCount >= 2, 'count=' + displayCount],
  ['代码块内容未被解析', codeText.includes('$notmath$'), JSON.stringify(codeText)],
  ['行内代码保持原文', inlineCodeOk, ''],
  ['货币文本未被当作公式', currencyOk, JSON.stringify(out.textContent.slice(0, 120))],
];
const failed = results.filter(r => !r[1]);
document.getElementById('summary').className = failed.length ? 'fail' : 'pass';
document.getElementById('summary').textContent =
  'TESTS: ' + (results.length - failed.length) + '/' + results.length + ' passed\n' +
  results.map(r => (r[1] ? 'PASS: ' : 'FAIL: ') + r[0] + (r[2] ? ' → ' + r[2] : '')).join('\n') +
  '\nRESULT=' + (failed.length ? 'FAIL' : 'PASS');
</script>
</body>
</html>
