<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渲染调试页</title>
<link rel="stylesheet" href="../lib/katex/katex.min.css">
<style>
  :root{--bg:#fff;--bg-side:#f7f8fa;--fg:#1f2328;--fg-dim:#656d76;--border:#d8dee4;--accent:#0969da;--code-bg:#f6f8fa}
  body{background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;margin:0}
  #doc{max-width:980px;margin:0 auto;padding:26px 28px 120px}
  #doc h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em;margin-top:1.2em}
  #doc h2{font-size:1.45em;border-bottom:1px solid var(--border);padding-bottom:.25em;margin-top:1.8em}
  #doc h3{font-size:1.2em;margin-top:1.5em}
  #doc table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px;display:block;overflow-x:auto}
  #doc th,#doc td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
  #doc th{background:var(--bg-side);font-weight:600}
  #doc code{background:var(--code-bg);padding:.15em .4em;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:.88em}
  #doc pre{background:var(--code-bg);padding:13px 15px;border-radius:8px;overflow:auto;border:1px solid var(--border)}
  #doc pre code{background:none;padding:0}
  #doc blockquote{margin:1em 0;padding:.4em 1em;border-left:4px solid var(--border);color:var(--fg-dim)}
  #doc a{color:var(--accent);text-decoration:none}
  #doc img{max-width:100%}
  #doc hr{border:none;border-top:1px solid var(--border);margin:2em 0}
  details.fm{margin:0 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg-side)}
  details.fm summary{cursor:pointer;padding:8px 13px;font-size:12.5px;color:var(--fg-dim)}
  details.fm pre{margin:0;border:none;border-top:1px solid var(--border);border-radius:0 0 8px 8px;font-size:12.5px}
  .mermaid{margin:1.2em 0;text-align:center;overflow-x:auto}
  .mermaid svg{max-width:100%;height:auto}
  .katex-block{margin:1em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
  #doc img.img-broken{min-height:40px;border:1px dashed #d1242f;border-radius:6px;padding:10px;color:#82071e;font-size:12px;background:rgba(255,235,233,.4)}
  #status{position:fixed;right:12px;bottom:12px;background:#1f2328;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;z-index:9}
</style>
</head>
<body>
<div id="doc"></div>
<div id="status">loading…</div>
<script src="../lib/marked.min.js"></script>
<script src="../lib/mermaid.min.js"></script>
<script src="../lib/katex/katex.min.js"></script>
<script type="module">
import { katexExtensions } from '../katex-ext.js';

marked.setOptions({ gfm: true, breaks: false });
marked.use({ extensions: katexExtensions(katex) });
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

const src = new URLSearchParams(location.search).get('src');
const docEl = document.getElementById('doc');
const status = document.getElementById('status');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function splitFrontmatter(text){
  if (text.slice(0,4) !== '---\n') return { fm:null, body:text };
  const end = text.indexOf('\n---', 3);
  if (end < 0) return { fm:null, body:text };
  const nl = text.indexOf('\n', end + 1);
  return { fm: text.slice(4, end), body: nl < 0 ? '' : text.slice(nl + 1) };
}

const text = await (await fetch(src)).text();
const sp = splitFrontmatter(text);
const fmHtml = sp.fm ? '<details class="fm"><summary>文档元数据 (frontmatter)</summary><pre>' + esc(sp.fm) + '</pre></details>' : '';
docEl.innerHTML = fmHtml + marked.parse(sp.body);

// mermaid 渲染（与 viewer.js 同逻辑）
const codes = docEl.querySelectorAll('code.language-mermaid');
for (const c of codes) {
  const pre = c.parentNode;
  const div = document.createElement('div');
  div.className = 'mermaid';
  div.dataset.src = c.textContent;
  div.textContent = c.textContent;
  pre.parentNode.replaceChild(div, pre);
}
const nodes = docEl.querySelectorAll('.mermaid');
if (nodes.length) { try { await mermaid.run({ nodes }); } catch(e) { console.warn('mermaid:', e); } }

// 相对图片 → blob URL（与 viewer.js 的 loadEmbeddedImages 同逻辑；此处走 fetch）
const baseDir = src.slice(0, src.lastIndexOf('/') + 1);
let imgErrors = [];
const imgJobs = Array.from(docEl.querySelectorAll('img[src]')).map(async (img) => {
  const s = img.getAttribute('src');
  if (!s || /^(https?:|data:|blob:)/i.test(s)) return;
  const rel = decodeURIComponent(s.split('#')[0].split('?')[0]);
  const url = new URL(rel.replace(/^\//, ''), location.origin + baseDir).href;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    img.src = URL.createObjectURL(await r.blob());
    await img.decode();          // 等解码完成，否则 naturalWidth 仍为 0
  } catch (e) {
    imgErrors.push(rel + ' → ' + e.message);
    img.classList.add('img-broken');
    img.alt = (img.alt || '图片') + ' [无法加载: ' + rel + ']';
  }
});
await Promise.all(imgJobs);

const katexCount = docEl.querySelectorAll('.katex').length;
const mermaidSvg = docEl.querySelectorAll('.mermaid svg').length;
const mermaidErr = docEl.querySelectorAll('.mermaid').length - mermaidSvg;
const imgs = Array.from(docEl.querySelectorAll('img'));
const imgsLoaded = imgs.filter((i) => i.naturalWidth > 0).length;
status.textContent = `katex=${katexCount} mermaid_svg=${mermaidSvg} mermaid_fail=${mermaidErr} imgs=${imgs.length} imgs_loaded=${imgsLoaded}` +
  (imgErrors.length ? ' ERR: ' + imgErrors.join('; ') : '');
</script>
</body>
</html>
